<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Nyann YT Music</title>
  <style>
    :root {
      --bg:#0a0c10; --card:#141820; --line:#243041; --text:#eef2f8;
      --muted:#8b9bb0; --accent:#ff4d4d; --accent2:#7c5cff;
      --green:#22c55e; --red:#ef4444;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;color:var(--text);
      background:radial-gradient(900px 480px at 80% -10%,#3a1520 0%,var(--bg) 55%);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    }
    .wrap{max-width:820px;margin:0 auto;padding:18px 14px 40px}
    h1{font-size:22px}
    .sub{color:var(--muted);font-size:13px;margin:6px 0 16px}

    /* --- CUSTOM PLAYER BOX --- */
    .player-box{
      background:#000;border:1px solid var(--line);border-radius:16px;
      overflow:hidden;margin-bottom:16px;aspect-ratio:16/9;position:relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #yt-player {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }
    .placeholder{
      position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);
      text-align:center;padding:20px;font-size:14px;z-index: 2;
    }

    /* Giao diện điều khiển tự chế */
    .custom-player {
      position: relative;
      z-index: 3;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      padding: 20px;
    }
    .custom-player.active { display: flex; }

    .track-info { text-align: center; max-width: 90%; }
    .track-title {
      font-size: 16px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 12px; color: var(--muted); margin-top: 4px;
    }

    /* Nhóm nút */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }
    .btn {
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: 0.15s;
      letter-spacing: 0.3px;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
    .btn:active { transform: translateY(0); }
    .btn-play {
      background: linear-gradient(135deg, var(--green), #16a34a);
      box-shadow: 0 3px 12px rgba(34,197,94,0.3);
    }
    .btn-stop {
      background: linear-gradient(135deg, var(--red), #b91c1c);
      box-shadow: 0 3px 12px rgba(239,68,68,0.3);
    }

    /* Ô nhập âm lượng */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 14px;
    }
    .volume-row label {
      font-size: 13px;
      color: var(--muted);
    }
    .volume-row input[type="number"] {
      width: 70px;
      background: #0a0c10;
      border: 1px solid var(--line);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      padding: 6px 8px;
      border-radius: 8px;
      outline: none;
      transition: 0.15s;
    }
    .volume-row input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(255,77,77,0.2);
    }
    .volume-row input[type="number"]::-webkit-outer-spin-button,
    .volume-row input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .volume-row input[type="number"] {
      -moz-appearance: textfield;
    }
    .volume-row .percent { color: var(--muted); font-size: 14px; }

    /* --- DANH SÁCH BÀI HÁT --- */
    .now{font-size:14px;margin-bottom:14px}
    .now b{color:#fff}
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
      gap:12px;
    }
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:14px;
      overflow:hidden;cursor:pointer;transition:.15s ease;
    }
    .card:hover{transform:translateY(-2px);border-color:#3a4a60}
    .card.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(255,77,77,.4)}
    .cover{
      width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#111;
    }
    .info{padding:10px}
    .title{font-size:13px;font-weight:600;line-height:1.35;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .artist{font-size:11px;color:var(--muted);margin-top:4px}
    .hint{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.5}
    code{background:#1c2430;padding:1px 6px;border-radius:6px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Nyann Music</h1>
    <div class="sub">Wed by real_@nyannnokonoko</div>

    <!-- KHU VỰC PLAYER -->
    <div class="player-box">
      <div id="yt-player"></div>

      <div class="placeholder" id="placeholder">Chọn một bài bên dưới để phát</div>

      <div class="custom-player" id="customPlayer">
        <div class="track-info">
          <div class="track-title" id="playingTitle">—</div>
          <div class="track-artist" id="playingArtist"></div>
        </div>

        <div class="btn-row">
          <button class="btn btn-play" id="playBtn">▶ Bật nhạc</button>
          <button class="btn btn-stop" id="stopBtn">■ Dừng nhạc</button>
        </div>

        <div class="volume-row">
          <label for="volumeInput">Âm lượng</label>
          <input type="number" id="volumeInput" min="0" max="100" value="80" />
          <span class="percent">%</span>
        </div>
      </div>
    </div>

    <div class="now">Đang phát: <b id="now">—</b></div>

    <div class="grid" id="grid"></div>

    <div class="hint">
      Wed music by nyann <code>SONGS</code><br/>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    /* =========================================================
       PLAYLIST
       ========================================================= */
    var SONGS = [
      { title: "Heroes Tonight", artist: "Janji", url: "https://www.youtube.com/watch?v=3nQNiWdeH2Q" },
      { title: "Gang Unit", artist: "Lil Loaded", url: "https://m.youtube.com/watch?v=DBhfYWOWR_k" },
      { title: "To The Max", artist: "Lil Loaded", url: "https://m.youtube.com/watch?v=4Mv--f1yfq8" },
      { title: "6Locc 6a6y ft. NLE Choppa (Remix)", artist: "Lil Loaded", url: "https://m.youtube.com/watch?v=aITIKxjFaL0" },
      { title: "Hai triệu năm", artist: "Đen Vâu", url: "https://m.youtube.com/watch?v=LSMDNL4n0kM" },
      { title: "Took Her To The O", artist: "King Von", url: "https://m.youtube.com/watch?v=hzt31eJTGxo" }
      / { title: "Shotta Flow (Remix)", artist: "NLE Choppa", url: "https://m.youtube.com/watch?v=2KDlDuS6r6I&list=RD2KDlDuS6r6I&start_radio=1&pp=ygUKbmxlIGNob3BwYaAHAQ%3D%3D" },
      / { title: "BAND4BAND", artist: "Central Cee", url: "https://m.youtube.com/watch?v=pDddlvCfTiw&list=RDpDddlvCfTiw&start_radio=1&pp=oAcB" },
      / { title: "Doja", artist: "Central Cee", url: "https://m.youtube.com/watch?v=_VuJA-VQRcY&list=RD_VuJA-VQRcY&start_radio=1&pp=oAcB" },
      / { title: "Ransom", artist: "Lil Tecca", url: "https://m.youtube.com/watch?v=1XzY2ij_vL4&list=RD1XzY2ij_vL4&start_radio=1&pp=oAcB0gcJCSsMAYcqIYzv" },
      // Thêm bài:
      // { title: "Tên bài", artist: "Ca sĩ", url: "https://youtu.be/VIDEO_ID" },
    ];

    function extractId(urlOrId) {
      if (!urlOrId) return null;
      var s = String(urlOrId).trim();
      var m;
      m = s.match(/[?&]v=([a-zA-Z0-9_-]{6,})/); if (m) return m[1];
      m = s.match(/youtu\.be\/([a-zA-Z0-9_-]{6,})/); if (m) return m[1];
      m = s.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,})/); if (m) return m[1];
      m = s.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{6,})/); if (m) return m[1];
      if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;
      return null;
    }

    function coverUrl(id) {
      return "https://img.youtube.com/vi/" + id + "/hqdefault.jpg";
    }

    var current = -1;
    var player;
    var isPlaying = false;

    var grid = document.getElementById("grid");
    var placeholder = document.getElementById("placeholder");
    var customPlayer = document.getElementById("customPlayer");
    var nowEl = document.getElementById("now");
    var playBtn = document.getElementById("playBtn");
    var stopBtn = document.getElementById("stopBtn");
    var volumeInput = document.getElementById("volumeInput");
    var playingTitle = document.getElementById("playingTitle");
    var playingArtist = document.getElementById("playingArtist");

    // Chuẩn hóa playlist
    var list = [];
    for (var i = 0; i < SONGS.length; i++) {
      var s = SONGS[i] || {};
      var id = extractId(s.url || s.id || s.link);
      if (!id) continue;
      list.push({ id: id, title: s.title || ("YouTube " + id), artist: s.artist || "" });
    }

    // --- YOUTUBE API ---
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '100%',
        width: '100%',
        videoId: '',
        playerVars: {
          'playsinline': 1,
          'controls': 0,
          'disablekb': 1,
          'fs': 0,
          'modestbranding': 1,
          'origin': window.location.origin
        },
        events: {
          'onReady': function(e) {
            var v = clampVolume(volumeInput.value);
            e.target.setVolume(v);
          },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) {
        isPlaying = true;
        playBtn.textContent = 'Tạm dừng';
      } else if (event.data == YT.PlayerState.PAUSED) {
        isPlaying = false;
        playBtn.textContent = '▶ Bật nhạc';
      } else if (event.data == YT.PlayerState.ENDED) {
        isPlaying = false;
        playBtn.textContent = '▶ Bật nhạc';
        if (current < list.length - 1) {
          playAt(current + 1);
        }
      }
    }

    // --- HÀM HỖ TRỢ ÂM LƯỢNG ---
    function clampVolume(val) {
      var n = parseInt(val, 10);
      if (isNaN(n)) n = 80;
      if (n < 0) n = 0;
      if (n > 100) n = 100;
      return n;
    }

    // --- NÚT ĐIỀU KHIỂN ---
    playBtn.onclick = function() {
      if (!player || !player.getPlayerState) return;
      var state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else if (state === YT.PlayerState.PAUSED) {
        player.playVideo();
      } else if (state === YT.PlayerState.CUED || state === -1) {
        if (current >= 0) playAt(current);
      }
    };

    stopBtn.onclick = function() {
      if (!player || !player.stopVideo) return;
      player.stopVideo();
      isPlaying = false;
      customPlayer.classList.remove('active');
      placeholder.style.display = 'grid';
      nowEl.textContent = '—';
      current = -1;
      playBtn.textContent = 'Bật nhạc';
      render();
    };

    // Nhập số âm lượng - giới hạn 0..100
    volumeInput.addEventListener('input', function() {
      var v = clampVolume(this.value);
      if (parseInt(this.value, 10) > 100) this.value = 100;
      if (parseInt(this.value, 10) < 0 && this.value !== '') this.value = 0;
      if (player && player.setVolume) {
        player.setVolume(v);
      }
    });

    volumeInput.addEventListener('blur', function() {
      this.value = clampVolume(this.value);
      if (player && player.setVolume) player.setVolume(this.value);
    });

    // --- HÀM PHÁT NHẠC ---
    function playAt(index) {
      if (index < 0 || index >= list.length) return;
      current = index;
      var song = list[index];

      placeholder.style.display = 'none';
      customPlayer.classList.add('active');
      playingTitle.textContent = song.title;
      playingArtist.textContent = song.artist || "Không rõ";
      nowEl.textContent = song.title + (song.artist ? " — " + song.artist : "");
      playBtn.textContent = 'Tạm dừng';

      if (player && player.loadVideoById) {
        var v = clampVolume(volumeInput.value);
        player.setVolume(v);
        player.loadVideoById(song.id);
      }
      render();
    }

    function render() {
      grid.innerHTML = "";
      list.forEach(function (song, i) {
        var card = document.createElement("div");
        card.className = "card" + (i === current ? " active" : "");
        card.innerHTML =
          '<img class="cover" alt="" loading="lazy" />' +
          '<div class="info"><div class="title"></div><div class="artist"></div></div>';
        var img = card.querySelector(".cover");
        img.src = coverUrl(song.id);
        img.onerror = function() {
          img.src = "https://img.youtube.com/vi/" + song.id + "/mqdefault.jpg";
        };
        card.querySelector(".title").textContent = song.title;
        card.querySelector(".artist").textContent = song.artist || song.id;
        card.onclick = function() { playAt(i); };
        grid.appendChild(card);
      });
    }

    render();
    if (!list.length) {
      placeholder.textContent = "Wed music";
    }
  </script>
</body>
  </html>
